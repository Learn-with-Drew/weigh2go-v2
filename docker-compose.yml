version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: weigh2go-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weigh2go
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: weigh2go-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/weigh2go
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weigh2go-network

  frontend:
    build: ./frontend
    container_name: weigh2go-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - weigh2go-network

volumes:
  postgres_data:

networks:
  weigh2go-network:
    driver: bridge